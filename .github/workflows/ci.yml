#
# GitHub Actions workflow for continuous integration (CI).
#
# Responsibilities
# - Enforce supported GitFlow pull-request targets.
# - Validate changes proposed for or pushed to long-lived GitFlow branches.
# - Run the repository's linting, type, policy, test, and package-build gates.
#
# Maintainer Notes
# - Global permissions are intentionally omitted; each job declares the minimum
#   permissions it needs.
# - External GitHub Actions are pinned to full commit SHAs to reduce supply-
#   chain risk.
# - The dynamic run name is part of the workflow contract: it should identify
#   the event and relevant branch for review clarity.
#
# References
# - GitHub Actions Python guide:
#   https://docs.github.com/en/actions/automating-builds-and-tests/
#   building-and-testing-python
# - GitHub Actions expressions reference:
#   https://docs.github.com/en/actions/learn-github-actions/expressions
# - GitHub Actions security hardening guide:
#   https://docs.github.com/en/actions/security-guides/
#   security-hardening-for-github-actions
# - GitHub Actions workflow syntax reference:
#   https://docs.github.com/en/actions/using-workflows/
#   workflow-syntax-for-github-actions
# - GitHub pull request documentation:
#   https://docs.github.com/en/pull-requests
# - GitHub merge queue documentation:
#   https://docs.github.com/en/repositories/
#   configuring-branches-and-merges-in-your-repository/configuring-merge-queues
# - Python packaging documentation:
#   https://packaging.python.org/
# - Python wheel format specification:
#   https://packaging.python.org/en/latest/specifications/
#   binary-distribution-format/#file-contents
---
name: CI

run-name: >-
  ${{
    github.event_name == 'pull_request' &&
    format('CI: {0} -> {1}', github.head_ref, github.base_ref) ||
    github.event_name == 'push' &&
    format('CI: push on {0}', github.ref_name) ||
    github.event_name == 'merge_group' &&
    format('CI: merge queue for {0}', github.ref_name) ||
    'CI: manual dispatch'
  }}

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  merge_group:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions: {}

env:
  DEFAULT_PYTHON_VERSION: "3.13"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-pr-target:
    name: Guard PR target branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce GitFlow pull-request targets
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "No pull-request target to validate for $EVENT_NAME."
            exit 0
          fi

          case "$BASE_REF:$HEAD_REF" in
            main:release/* | main:hotfix/*)
              echo "Pull-request target is valid for main."
              ;;
            develop:feature/* | develop:bugfix/* | develop:chore/* | develop:ci/* | develop:docs/* | develop:dependabot/* | develop:sync/*)
              echo "Pull-request target is valid for develop."
              ;;
            *)
              echo "Unsupported GitFlow path: $HEAD_REF -> $BASE_REF" >&2
              exit 1
              ;;
          esac

  validate:
    name: Validate package
    needs: guard-pr-target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # Pinned v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # Pinned v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Lint Python code
        run: python -m ruff check .

      - name: Check Python types
        run: python -m mypy src tests scripts

      - name: Verify GitHub Actions pins
        run: python scripts/check_workflow_pins.py

      - name: Verify minimum Python version policy
        run: python scripts/check_python_policy.py

      - name: Run unit tests
        run: python -m pytest

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*
