#
# GitHub Actions workflow for continuous integration (CI).
#
# Responsibilities
# - Validate source, workflow policy, tests, coverage, documentation, and
#   synthesized infrastructure before changes merge.
# - Exercise every explicitly supported Python version.
# - Test the lowest and newest runtime dependencies allowed by package metadata.
# - Build non-HTML documentation targets.
# - Smoke-test installation on each supported operating-system family.
# - Validate built artifacts and documented example applications.
#
# Maintainer Notes
# - Global permissions are intentionally omitted; each job declares the minimum
#   permissions it needs.
# - External GitHub Actions are pinned to full commit SHAs to reduce supply-
#   chain risk.
# - Keep pull-request target policy in `pr.yml`; this workflow remains the
#   repository's comprehensive validation gate.
# - The dynamic run name identifies the source and target context for review.
# - The dependency matrix covers every supported Python version at both
#   dependency boundaries.
#
# References
# - GitHub Actions Python guide:
#   https://docs.github.com/en/actions/automating-builds-and-tests/
#   building-and-testing-python
# - GitHub Actions expressions reference:
#   https://docs.github.com/en/actions/learn-github-actions/expressions
# - GitHub Actions security hardening guide:
#   https://docs.github.com/en/actions/security-guides/
#   security-hardening-for-github-actions
# - GitHub Actions workflow syntax reference:
#   https://docs.github.com/en/actions/using-workflows/
#   workflow-syntax-for-github-actions
# - GitHub pull request documentation:
#   https://docs.github.com/en/pull-requests
# - GitHub merge queue documentation:
#   https://docs.github.com/en/repositories/
#   configuring-branches-and-merges-in-your-repository/configuring-merge-queues
# - Python packaging documentation:
#   https://packaging.python.org/
# - Python wheel format specification:
#   https://packaging.python.org/en/latest/specifications/
#   binary-distribution-format/#file-contents
# - Sphinx builders reference:
#   https://www.sphinx-doc.org/en/master/usage/builders/index.html

---
name: Continuous Integration (CI)

run-name: >-
  ${{
    github.event_name == 'pull_request' &&
    format('CI: {0} -> {1}', github.head_ref, github.base_ref) ||
    github.event_name == 'merge_group' &&
    format('CI: merge queue for {0}', github.ref_name) ||
    github.event_name == 'push' &&
    format('CI: push on {0}', github.ref_name) ||
    'CI: manual dispatch'
  }}

on:
  pull_request:
    branches:
      # Long-lived GitFlow branches
      - main
      - develop
  merge_group:
    branches:
      # Long-lived GitFlow branches
      - main
      - develop
  push:
    branches:
      # Long-lived GitFlow branches
      - main
      - develop
  workflow_dispatch:

permissions: {}

env:
  DEFAULT_PYTHON_VERSION: '3.13'
  PACKAGE_IMPORT_NAME: aws_cdk_static_site

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # Pinned v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-python-project
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          extras: dev,docs,security

      - name: Verify release changelog
        if: >-
          github.event_name == 'pull_request' &&
          (startsWith(github.head_ref, 'release/') ||
          startsWith(github.head_ref, 'hotfix/'))
        env:
          RELEASE_BRANCH: ${{ github.head_ref }}
        run: |
          release_version="${RELEASE_BRANCH#*/}"
          python -m scripts check-release-changelog "$release_version"

      - name: Verify versioned release document
        if: >-
          github.event_name == 'pull_request' &&
          (startsWith(github.head_ref, 'release/') ||
          startsWith(github.head_ref, 'hotfix/'))
        env:
          RELEASE_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          release_version="${RELEASE_BRANCH#*/}"
          release_tag="v${release_version#v}"
          release_document="docs/releases/${release_tag}.md"
          if [[ ! -f "$release_document" ]]; then
            echo "Release document does not exist: $release_document" >&2
            exit 1
          fi
          if ! grep -Fq "(${release_tag}.md)" docs/releases/README.md; then
            echo "Release archive does not index ${release_tag}.md." >&2
            exit 1
          fi

      - name: Run the repository quality gate
        run: make check-pre-push PYTHON=python

      - name: Build documentation
        run: >-
          python -m sphinx -T -W --keep-going
          -b html docs/source docs/build/html

  document:
    name: Build docs (${{ matrix.builder }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        builder:
          - epub
          - linkcheck
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # Pinned v7.0.1
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-python-project
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          extras: docs

      - name: Build documentation
        env:
          DOCS_BUILDER: ${{ matrix.builder }}
        run: >-
          python -m sphinx -T -W --keep-going
          -b "$DOCS_BUILDER"
          -d "docs/build/doctrees/$DOCS_BUILDER"
          docs/source "docs/build/$DOCS_BUILDER"

  test-dependency-boundaries:
    name: >-
      Test Python ${{ matrix.python-version }} with
      ${{ matrix.dependency-boundary }} dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"
        dependency-boundary:
          - lowest
          - newest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # Pinned v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: ./.github/actions/setup-python-project
        with:
          python-version: ${{ matrix.python-version }}
          install: 'false'
          cache-dependency-path: |
            pyproject.toml
            requirements/lowest.txt

      - name: Install dependency boundary
        env:
          DEPENDENCY_BOUNDARY: ${{ matrix.dependency-boundary }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEPENDENCY_BOUNDARY" == "lowest" ]]; then
            python -m pip install --disable-pip-version-check \
              --constraint requirements/lowest.txt \
              -e '.[dev]'
          else
            python -m pip install --disable-pip-version-check \
              --upgrade --upgrade-strategy eager \
              -e '.[dev]'
          fi

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Report resolved dependency versions
        shell: bash
        run: |
          python - <<'PY'
          from importlib.metadata import version

          for distribution in ('aws-cdk-lib', 'constructs'):
              print(f'{distribution}=={version(distribution)}')
          PY

      - name: Run tests
        run: python -m pytest -q

  smoke-cross-platform:
    name: Smoke install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # Pinned v7.0.1
        with:
          persist-credentials: false

      - name: Install package
        uses: ./.github/actions/setup-python-project
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          editable: 'false'

      - name: Verify installed package import
        run: >-
          python -c
          'import importlib, os;
          importlib.import_module(os.environ["PACKAGE_IMPORT_NAME"])'

  validate-artifacts:
    name: Validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # Pinned v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-python-project
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          extras: dev

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Verify distribution contents
        run: >-
          python -m pytest --no-cov
          --artifact-dir dist tests/meta/test_package_artifacts.py

      - name: Install and smoke-test distributions
        run: >-
          python -m pytest --no-cov
          --artifact-dir dist tests/e2e/test_distribution_installation.py
