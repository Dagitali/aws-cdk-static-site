# deployment-test.yml
# aws-cdk-static-site
#
# Copyright © 2026 Dagitali LLC. All rights reserved.
#
# Manually deploy and destroy a tightly bounded AWS test stack.
#
# Responsibilities
# - Require an explicit operator acknowledgement and protected environment.
# - Use GitHub OIDC for short-lived AWS credentials.
# - Reject templates containing resources outside the reviewed allowlist.
# - Delete the uniquely named stack even when post-deployment validation fails.
#
# Maintainer Notes
# - Configure AWS_ACCOUNT_ID and AWS_DEPLOY_TEST_ROLE_ARN as variables in the
#   protected deployment-test GitHub environment before enabling this workflow.
# - The stack contains one empty, unversioned S3 bucket and one CloudFront
#   distribution; it creates no DNS, certificate, WAF, logs, or content assets.
# - Keep this workflow manual and never add a scheduled or push trigger.

---
name: Test disposable AWS deployment

run-name: Test disposable AWS deployment from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY-AND-DESTROY to create the bounded AWS test stack
        required: true
        type: string

permissions: {}

env:
  CDK_DEFAULT_REGION: us-east-1
  DEFAULT_PYTHON_VERSION: "3.13"

concurrency:
  group: aws-cdk-static-site-disposable-deployment
  cancel-in-progress: false

jobs:
  deploy-test:
    name: Deploy and destroy bounded stack
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DEPLOY-AND-DESTROY'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment: deployment-test
    env:
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      DEPLOYMENT_TEST_STACK_NAME: AwsCdkStaticSiteTest-${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # Pinned v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # Pinned v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          cache: pip

      - name: Get short-lived AWS credentials
        id: credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # Pinned v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_TEST_ROLE_ARN }}
          role-session-name: static-site-test-${{ github.run_id }}
          aws-region: ${{ env.CDK_DEFAULT_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Install package
        run: python -m pip install --disable-pip-version-check .

      - name: Synthesize bounded stack
        run: python examples/disposable-deployment/app.py

      - name: Verify bounded resource allowlist
        run: |
          set -euo pipefail
          template="cdk.out/${DEPLOYMENT_TEST_STACK_NAME}.template.json"
          allowed='^(AWS::CDK::Metadata|AWS::CloudFront::Distribution|AWS::CloudFront::OriginAccessControl|AWS::CloudFront::ResponseHeadersPolicy|AWS::S3::Bucket|AWS::S3::BucketPolicy)$'
          unexpected="$(jq -r '.Resources[].Type' "$template" | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected resource types:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          jq -e '
            ([.Resources[].Type |
              select(. == "AWS::S3::Bucket")] | length) == 1 and
            ([.Resources[].Type |
              select(. == "AWS::CloudFront::Distribution")] | length) == 1 and
            ([.Resources[].Type |
              select(. == "AWS::CloudFront::OriginAccessControl")] | length) == 1 and
            ([.Resources | to_entries[] |
              select(.value.Type == "AWS::S3::Bucket") |
              .value.DeletionPolicy] == ["Delete"]) and
            ([.Resources | to_entries[] |
              select(.value.Type == "AWS::S3::Bucket") |
              .value.UpdateReplacePolicy] == ["Delete"]) and
            ([.Resources | to_entries[] |
              select(.value.Type == "AWS::S3::Bucket") |
              .value.Properties.VersioningConfiguration.Status] == [null]) and
            ([.Resources | to_entries[] |
              select(.value.Type == "AWS::CloudFront::Distribution") |
              .value.Properties.DistributionConfig.PriceClass] ==
              ["PriceClass_100"])
          ' "$template" > /dev/null

      - name: Deploy bounded stack
        id: deploy
        run: >-
          aws cloudformation deploy
          --stack-name "$DEPLOYMENT_TEST_STACK_NAME"
          --template-file "cdk.out/${DEPLOYMENT_TEST_STACK_NAME}.template.json"
          --no-fail-on-empty-changeset

      - name: Verify deployed stack
        run: >-
          aws cloudformation describe-stacks
          --stack-name "$DEPLOYMENT_TEST_STACK_NAME"
          --query 'Stacks[0].StackStatus'
          --output text

      - name: Destroy bounded stack
        if: always() && steps.credentials.outcome == 'success'
        run: |
          set -euo pipefail
          if aws cloudformation describe-stacks \
            --stack-name "$DEPLOYMENT_TEST_STACK_NAME" > /dev/null 2>&1; then
            aws cloudformation delete-stack \
              --stack-name "$DEPLOYMENT_TEST_STACK_NAME"
            aws cloudformation wait stack-delete-complete \
              --stack-name "$DEPLOYMENT_TEST_STACK_NAME"
          fi
