# Copyright © 2026 Dagitali LLC. All rights reserved.
#
# GitHub Actions workflow for Software Bill of Materials (SBOM) generation.
#
# Responsibilities
# - Generate a CycloneDX SBOM for the installed Python dependency surface.
# - Validate and upload the document as a short-lived workflow artifact.
#
# Maintainer Notes
# - Global permissions are intentionally omitted; each job declares the minimum
#   permissions it needs.
# - External GitHub Actions are pinned to full commit SHAs to reduce supply-
#   chain risk.
# - Pull requests intentionally do not trigger this supplementary workflow;
#   required CI already validates dependency and lockfile changes before merge.
#
# References
# - CycloneDX Python tooling:
#   https://cyclonedx.org/tool-center/python/
# - GitHub Actions artifact documentation:
#   https://docs.github.com/en/actions/using-workflows/
#   storing-workflow-data-as-artifacts

---
name: SBOM

run-name: >-
  ${{
    github.event_name == 'push' &&
    format('SBOM: push on {0}', github.ref_name) ||
    'SBOM: manual dispatch'
  }}

on:
  push:
    branches:
      - develop
      - main
    paths:
      - pyproject.toml
      - src/**
      - .github/workflows/sbom.yml
  workflow_dispatch:

permissions: {}

env:
  ARTIFACT_RETENTION_DAYS: "14"
  CYCLONEDX_BOM_VERSION: "7.2.2"
  DEFAULT_PYTHON_VERSION: "3.13"
  PYTHON_SBOM_FILENAME: python-sbom.json
  SBOM_ARTIFACT_NAME: python-sbom

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # Pinned v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate Python SBOM
        uses: Dagitali/python-project-lifecycle@3830839be6caca98cacca702c5aa38805c4fb516  # Pinned v0.1.2
        with:
          phase: sbom
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          pip-install: "."
          working-directory: .
          sbom-tool-version: ${{ env.CYCLONEDX_BOM_VERSION }}
          sbom-output-file: ${{ env.PYTHON_SBOM_FILENAME }}
          sbom-output-format: JSON

      - name: Validate Python SBOM
        run: |
          jq -e '
            .bomFormat == "CycloneDX" and
            ((.specVersion | type) == "string") and
            ((.components | type) == "array")
          ' "$PYTHON_SBOM_FILENAME" > /dev/null

      - name: Upload Python SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.SBOM_ARTIFACT_NAME }}
          path: ${{ env.PYTHON_SBOM_FILENAME }}
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
