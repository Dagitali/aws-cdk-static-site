#
# GitHub Actions workflow for tagged and historical GitHub Releases.
#
# Responsibilities
# - Build the tagged source and wheel distributions exactly once.
# - Check and smoke-test each distribution in an isolated environment.
# - Generate checksums and a CycloneDX SBOM for release attachment.
# - Publish validated artifacts to the GitHub Release for the existing tag.
# - Recover missing historical releases from explicitly selected immutable tags.
#
# Maintainer Notes
# - Manual runs backfill an existing tag and never mark it as the latest release.
# - This workflow publishes GitHub Releases but does not publish to PyPI.
# - Global permissions are intentionally omitted; each job declares the minimum
#   permissions it needs.
# - External GitHub Actions are pinned to full commit SHAs.
#
# References
# - GitHub release documentation:
#   https://docs.github.com/en/repositories/releasing-projects-on-github
# - GitHub Actions Python packaging guide:
#   https://docs.github.com/en/actions/automating-builds-and-tests/
#   building-and-testing-python
# - Python packaging documentation: https://packaging.python.org/
# - CycloneDX Python tooling: https://cyclonedx.org/tool-center/python/

---
name: Release

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' &&
    format('Backfill release {0}', inputs.release_tag) ||
    format('Release {0}', github.ref_name)
  }}

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semantic-version tag to backfill
        required: true
        type: string

permissions: {}

env:
  ARTIFACT_RETENTION_DAYS: "14"
  CYCLONEDX_BOM_VERSION: "7.2.2"
  DEFAULT_PYTHON_VERSION: "3.13"
  PACKAGE_DISTRIBUTION_NAME: aws-cdk-static-site
  PACKAGE_IMPORT_NAME: aws_cdk_static_site
  RELEASE_ARTIFACT_NAME: release-artifacts
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  SBOM_FILENAME: python-sbom.json
  SYNTHESIS_EXAMPLE: examples/basic/app.py

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # Pinned v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify immutable release tag
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "Release tag must be annotated: $RELEASE_TAG" >&2
            exit 1
          fi
          tagged_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$tagged_commit" != "$GITHUB_SHA" && "$tagged_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked-out commit does not match $RELEASE_TAG." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # Pinned v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          cache: pip

      - name: Verify versioned changelog
        run: python -m scripts.check_release_changelog "${RELEASE_TAG}"

      - name: Verify release installation snippet
        if: github.event_name == 'push'
        run: python -m scripts.update_release_snippet --check "${RELEASE_TAG}"

      - name: Install release tools
        run: |
          python -m pip install --disable-pip-version-check \
            "build>=1.3,<2" \
            "pytest>=9.0,<10" \
            "pytest-cov>=7.0,<8" \
            "twine>=6.2,<8"

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Verify distribution contents
        run: >-
          python -m pytest --no-cov
          --artifact-dir dist tests/meta/test_package_artifacts.py

      - name: Smoke-test each distribution
        run: |
          set -euo pipefail
          shopt -s nullglob

          artifacts=(dist/*.tar.gz dist/*.whl)
          if [[ "${#artifacts[@]}" -ne 2 ]]; then
            echo "Expected one sdist and one wheel; found ${#artifacts[@]}." >&2
            exit 1
          fi

          index=0
          for artifact in "${artifacts[@]}"; do
            environment="${RUNNER_TEMP}/artifact-${index}"
            expected_version="${RELEASE_TAG#v}"
            python -m venv "$environment"
            "$environment/bin/python" -m pip install \
              --disable-pip-version-check "$artifact"
            actual_version="$(
              "$environment/bin/python" -c \
                'import os; from importlib.metadata import version; print(version(os.environ["PACKAGE_DISTRIBUTION_NAME"]))'
            )"
            if [[ "$actual_version" != "$expected_version" ]]; then
              echo "Expected version ${expected_version}; found ${actual_version}." >&2
              exit 1
            fi
            "$environment/bin/python" -c \
              'import importlib, os; importlib.import_module(os.environ["PACKAGE_IMPORT_NAME"])'
            "$environment/bin/python" "$SYNTHESIS_EXAMPLE"
            index=$((index + 1))
          done

      - name: Generate release SBOM
        run: |
          set -euo pipefail

          target_environment="${RUNNER_TEMP}/sbom-target"
          tool_environment="${RUNNER_TEMP}/sbom-tool"
          python -m venv "$target_environment"
          "$target_environment/bin/python" -m pip install \
            --disable-pip-version-check dist/*.whl
          python -m venv "$tool_environment"
          "$tool_environment/bin/python" -m pip install \
            --disable-pip-version-check \
            "cyclonedx-bom==${CYCLONEDX_BOM_VERSION}"
          "$tool_environment/bin/cyclonedx-py" environment \
            "$target_environment/bin/python" \
            --output-format JSON \
            --output-file "dist/${SBOM_FILENAME}"

      - name: Validate release SBOM
        run: |
          jq -e '
            .bomFormat == "CycloneDX" and
            ((.specVersion | type) == "string") and
            ((.components | type) == "array")
          ' "dist/${SBOM_FILENAME}" > /dev/null

      - name: Generate checksums
        working-directory: dist
        run: >-
          sha256sum -- ./*.tar.gz ./*.whl "./${SBOM_FILENAME}"
          > SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # Pinned v7.0.1
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS
            dist/${{ env.SBOM_FILENAME }}
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # Pinned v8.0.1
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # Pinned v3.0.3
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS
            dist/${{ env.SBOM_FILENAME }}
          generate_release_notes: true
          make_latest: ${{ github.event_name == 'push' }}
          tag_name: ${{ env.RELEASE_TAG }}
