# aws-cdk-static-site
#
# Copyright © 2026 Dagitali LLC. All rights reserved.
#
# GitHub Dependabot configuration for automated dependency-update pull
# requests.
#
# Responsibilities
# - Keep GitHub Actions, Python package metadata, and pre-commit hooks current
#   through reviewable pull requests.
# - Route routine dependency maintenance through the GitFlow development
#   branch before release promotion.
# - Reduce supply-chain exposure from stale dependencies while preserving
#   review, CI, and package-build gates.
#
# Maintainer Notes
# - `pyproject.toml` is the canonical Python dependency metadata source.
# - Dependency update pull requests intentionally target `develop`; release
#   branches receive them through normal GitFlow promotion unless an urgent
#   security fix requires a hotfix.
# - Keep external GitHub Actions pinned to full commit SHAs after accepting
#   Dependabot updates.
#
# References
# - GitHub Advisory Database: https://github.com/advisories
# - GitHub Dependabot documentation:
#   https://docs.github.com/en/code-security/dependabot
# - Dependabot configuration reference:
#   https://docs.github.com/en/code-security/dependabot/
#   dependabot-version-updates/
#   configuration-options-for-the-dependabot.yml-file
# - Dependabot quickstart guide:
#   https://docs.github.com/en/code-security/tutorials/
#   secure-your-dependencies/dependabot-quickstart-guide
# - Python packaging documentation:
#   https://packaging.python.org/

---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    labels:
      - dependencies
      - python
    commit-message:
      prefix: build
      include: scope
    groups:
      python-runtime-dependencies:
        dependency-type: production
      python-maintenance-dependencies:
        dependency-type: development

  - package-ecosystem: pre-commit
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/New_York
    labels:
      - dependencies
      - pre-commit
    commit-message:
      prefix: build
      include: scope
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
